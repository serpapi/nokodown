name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}, nokolexbor ${{ matrix.nokolexbor || 'latest' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ruby, with the last nokolexbor that runs on it.
          - ruby: "2.7"
            nokolexbor: "0.6.4"
          - ruby: "3.4"
            nokolexbor: "0.6.4"
          - ruby: "3.4"
            nokolexbor: ""
    env:
      NOKOLEXBOR_VERSION: ${{ matrix.nokolexbor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
